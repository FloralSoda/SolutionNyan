<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MINA.SWEEP — SCP-7934</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
  :root {
    --bg:#050810;--panel:#0a0f1e;--border:#1a2a4a;--accent:#4a9eff;--accent2:#8b5cf6;
    --danger:#ff4a6e;--cell-bg:#0d1425;--cell-revealed:#060c18;--cell-hover:#111e35;
    --text:#c0d8ff;--dim:#3a5580;
    --glow:0 0 12px rgba(74,158,255,0.4);--glow-danger:0 0 12px rgba(255,74,110,0.5);
    --glow-win:0 0 20px rgba(139,92,246,0.6);
    --cell-size:clamp(26px, 8vw, 36px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow-x:hidden;}
  body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:12px 8px 20px;
    background-image:radial-gradient(ellipse at 20% 20%,rgba(74,158,255,0.04) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 80%,rgba(139,92,246,0.04) 0%,transparent 60%);}
  header{text-align:center;margin-bottom:12px;}
  .logo{font-family:'Orbitron',sans-serif;font-size:clamp(1rem,5vw,2.2rem);font-weight:900;
    letter-spacing:0.15em;color:var(--accent);text-shadow:var(--glow);}
  .logo span{color:var(--accent2);}
  .subtitle{font-size:clamp(0.5rem,2vw,0.7rem);color:var(--dim);letter-spacing:0.2em;margin-top:4px;}
  .controls{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;align-items:center;}
  .diff-btn{font-family:'Share Tech Mono',monospace;font-size:clamp(0.6rem,2.5vw,0.75rem);
    letter-spacing:0.08em;background:var(--panel);border:1px solid var(--border);
    color:var(--dim);padding:5px 10px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;
    touch-action:manipulation;}
  .diff-btn:hover,.diff-btn.active{border-color:var(--accent);color:var(--accent);box-shadow:var(--glow);}
  .hud{display:flex;gap:clamp(10px,4vw,30px);margin-bottom:12px;align-items:center;}
  .hud-panel{background:var(--panel);border:1px solid var(--border);padding:6px 12px;
    display:flex;flex-direction:column;align-items:center;min-width:70px;}
  .hud-label{font-size:clamp(0.5rem,1.8vw,0.6rem);color:var(--dim);letter-spacing:0.15em;text-transform:uppercase;}
  .hud-value{font-family:'Orbitron',sans-serif;font-size:clamp(1rem,4vw,1.4rem);font-weight:700;color:var(--accent);}
  .hud-value.danger{color:var(--danger);}
  .reset-btn{font-family:'Orbitron',sans-serif;font-size:clamp(0.6rem,2.5vw,0.8rem);font-weight:700;
    background:transparent;border:1px solid var(--accent);color:var(--accent);
    padding:8px 14px;cursor:pointer;letter-spacing:0.08em;transition:all 0.2s;
    touch-action:manipulation;}
  .reset-btn:hover{background:rgba(74,158,255,0.1);box-shadow:var(--glow);}
  .board-wrap{border:1px solid var(--border);background:var(--panel);
    padding:clamp(6px,2vw,12px);
    box-shadow:0 0 40px rgba(74,158,255,0.05),inset 0 0 20px rgba(0,0,0,0.5);
    position:relative;max-width:100%;overflow:auto;}
  .board-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0.5;}
  #board{display:grid;gap:2px;user-select:none;}
  .cell{width:var(--cell-size);height:var(--cell-size);background:var(--cell-bg);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-family:'Orbitron',sans-serif;font-weight:700;
    font-size:clamp(0.55rem,2.2vw,0.85rem);
    transition:background 0.1s;position:relative;overflow:hidden;
    touch-action:manipulation;}
  .cell:hover:not(.revealed):not(.freed):not(.exploded):not(.mine-revealed){
    background:var(--cell-hover);border-color:var(--accent);}
  /* Chord highlight — number cell with all mines flagged, ready to chord */
  .cell.chord-ready{background:rgba(74,158,255,0.12);border-color:var(--accent);
    box-shadow:inset 0 0 6px rgba(74,158,255,0.3);cursor:pointer;}
  .cell.revealed{background:var(--cell-revealed);border-color:#080f1f;cursor:default;}
  .cell.revealed.chord-ready{cursor:pointer;}
  .cell.flagged{background:rgba(139,92,246,0.12);border-color:var(--accent2);}
  .cell.flagged::after{content:'⚑';color:var(--accent2);font-size:clamp(0.7rem,2.5vw,1rem);
    filter:drop-shadow(0 0 4px var(--accent2));}
  .cell.freed{background:rgba(139,92,246,0.15);border-color:var(--accent2);
    animation:freed-pulse 1.5s ease-in-out infinite;}
  @keyframes freed-pulse{
    0%,100%{background:rgba(139,92,246,0.15);box-shadow:none;}
    50%{background:rgba(139,92,246,0.28);box-shadow:0 0 10px rgba(139,92,246,0.5);}
  }
  .cell.exploded{background:rgba(255,74,110,0.25)!important;border-color:var(--danger)!important;
    box-shadow:var(--glow-danger);}
  .cell.mine-revealed{background:rgba(20,5,10,0.9);border-color:#2a0f1a;}
  .cell .mina-img{width:calc(var(--cell-size) - 8px);height:calc(var(--cell-size) - 8px);
    object-fit:cover;border-radius:50%;}
  .cell.freed .mina-img{filter:drop-shadow(0 0 5px rgba(139,92,246,0.9));
    animation:freed-spin 0.5s ease-out;}
  @keyframes freed-spin{from{transform:scale(0) rotate(-180deg);}to{transform:scale(1) rotate(0deg);}}
  .cell.mine-revealed .mina-img{filter:grayscale(0.3) drop-shadow(0 0 3px rgba(255,74,110,0.3));}
  .cell.exploded .mina-img{filter:drop-shadow(0 0 8px rgba(255,74,110,1));
    animation:explode-shake 0.3s ease-out;}
  @keyframes explode-shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px) rotate(-5deg);}75%{transform:translateX(4px) rotate(5deg);}}
  .n1{color:#4a9eff;}.n2{color:#50fa7b;}.n3{color:#ff6b6b;}.n4{color:#bd93f9;}
  .n5{color:#ff9800;}.n6{color:#8be9fd;}.n7{color:#ff79c6;}.n8{color:#f8f8f2;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(5,8,16,0.88);z-index:100;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;
    backdrop-filter:blur(4px);padding:20px;}
  .overlay.show{display:flex;}
  .overlay-box{background:var(--panel);border:1px solid var(--border);
    padding:clamp(20px,5vw,40px) clamp(24px,8vw,60px);
    text-align:center;animation:reveal 0.4s ease;width:100%;max-width:380px;
    display:flex;flex-direction:column;align-items:center;}
  @keyframes reveal{from{opacity:0;transform:scale(0.9) translateY(-10px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .overlay-box.win{border-color:var(--accent2);box-shadow:0 0 60px rgba(139,92,246,0.2);}
  .overlay-box.win .overlay-title{color:var(--accent2);text-shadow:var(--glow-win);}
  .overlay-box.lose .overlay-title{color:var(--danger);text-shadow:var(--glow-danger);}
  .overlay-mina{width:clamp(60px,15vw,80px);height:clamp(60px,15vw,80px);border-radius:50%;
    margin:0 auto 14px;object-fit:cover;object-position:70% center;display:block;}
  .overlay-box.win .overlay-mina{filter:drop-shadow(0 0 12px rgba(139,92,246,0.9));animation:float 2s ease-in-out infinite;}
  .overlay-box.lose .overlay-mina{filter:grayscale(0.4) drop-shadow(0 0 8px rgba(255,74,110,0.5));}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .overlay-title{font-family:'Orbitron',sans-serif;font-size:clamp(1.4rem,6vw,2rem);
    font-weight:900;letter-spacing:0.1em;margin-bottom:8px;}
  .overlay-sub{color:var(--dim);font-size:clamp(0.65rem,2.5vw,0.8rem);letter-spacing:0.12em;margin-bottom:20px;white-space:nowrap;}
  .overlay-btn{font-family:'Orbitron',sans-serif;font-size:clamp(0.7rem,2.5vw,0.9rem);
    background:transparent;border:1px solid var(--accent);color:var(--accent);
    padding:10px 24px;cursor:pointer;letter-spacing:0.1em;transition:all 0.2s;
    touch-action:manipulation;}
  .overlay-btn:hover{background:rgba(74,158,255,0.1);box-shadow:var(--glow);}
  .scanline{position:fixed;inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
    pointer-events:none;z-index:200;}
  footer{margin-top:12px;color:var(--dim);font-size:clamp(0.5rem,1.8vw,0.6rem);
    letter-spacing:0.15em;opacity:0.5;text-align:center;padding:0 10px;}
  /* Hard mode board: allow horizontal scroll on very small screens */
  @media(max-width:400px){
    .board-wrap{ padding:6px; }
    :root{ --cell-size: max(24px, calc((100vw - 40px) / var(--board-cols, 9))); }
  }
</style>
</head>
<body>
<div class="scanline"></div>
<header>
  <div class="logo">MINA<span>.</span>SWEEP</div>
  <div class="subtitle">SCP-7934 · INSTANCE LIBERATION PROTOCOL</div>
</header>
<div class="controls">
  <button class="diff-btn active" onclick="setDifficulty(9,9,10,this)">EASY</button>
  <button class="diff-btn" onclick="setDifficulty(16,16,40,this)">MEDIUM</button>
  <button class="diff-btn" onclick="setDifficulty(16,30,99,this)">HARD</button>
</div>
<div class="hud">
  <div class="hud-panel"><div class="hud-label">INSTANCES</div><div class="hud-value danger" id="mine-count">10</div></div>
  <button class="reset-btn" onclick="init()">[ REINIT ]</button>
  <button class="reset-btn" id="mute-btn" onclick="toggleMusic()" style="font-size:clamp(0.55rem,2vw,0.75rem);padding:8px 10px;">♪ MUSIC</button>
  <div class="hud-panel"><div class="hud-label">ELAPSED</div><div class="hud-value" id="timer">000</div></div>
</div>
<div class="hud" style="margin-top:-6px;margin-bottom:12px;">
  <div class="hud-panel" style="min-width:140px;">
    <div class="hud-label">WIN STREAK</div>
    <div class="hud-value" id="streak-value" style="color:var(--accent2);">0</div>
  </div>
  <div class="hud-panel" style="min-width:140px;">
    <div class="hud-label">BEST STREAK</div>
    <div class="hud-value" id="best-streak-value" style="color:var(--accent2);">0</div>
  </div>
</div>
<div class="board-wrap"><div id="board"></div></div>
<footer>FLAG: long press / right-click &nbsp;·&nbsp; CHORD: tap a number when its mines are flagged</footer>
<div class="overlay" id="overlay">
  <div class="overlay-box" id="overlay-box">
    <img id="overlay-mina" class="overlay-mina" src="" alt="Mina">
    <div class="overlay-title" id="overlay-title"></div>
    <div class="overlay-sub" id="overlay-sub"></div>
    <button class="overlay-btn" onclick="init();document.getElementById('overlay').classList.remove('show')">[ REINITIALIZE ]</button>
  </div>
</div>

// Audio context
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

// ─── Sound Effects ────────────────────────────────────────────────────────────

function playOsc(type, freq, vol, attack, decay, when) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, when);
  gain.gain.setValueAtTime(0, when);
  gain.gain.linearRampToValueAtTime(vol, when + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
  osc.start(when);
  osc.stop(when + attack + decay + 0.01);
}

function playSweep(type, freqStart, freqEnd, vol, attack, decay, when) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, when);
  osc.frequency.linearRampToValueAtTime(freqEnd, when + attack + decay);
  gain.gain.setValueAtTime(0, when);
  gain.gain.linearRampToValueAtTime(vol, when + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
  osc.start(when);
  osc.stop(when + attack + decay + 0.01);
}

function playNoise(vol, duration, when) {
  const ctx = getAudioCtx();
  const bufSize = Math.floor(ctx.sampleRate * duration);
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  const src = ctx.createBufferSource();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 800;
  filter.Q.value = 0.5;
  src.buffer = buf;
  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  gain.gain.setValueAtTime(vol, when);
  gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);
  src.start(when);
  src.stop(when + duration + 0.01);
}

const SFX = {
  click() {
    const t = getAudioCtx().currentTime;
    playOsc('square', 180, 0.15, 0.001, 0.04, t);
    playNoise(0.08, 0.03, t);
  },
  flag() {
    const t = getAudioCtx().currentTime;
    playSweep('square', 300, 600, 0.12, 0.01, 0.08, t);
    playOsc('sine', 800, 0.08, 0.005, 0.06, t + 0.08);
  },
  unflag() {
    const t = getAudioCtx().currentTime;
    playSweep('square', 600, 250, 0.12, 0.01, 0.08, t);
  },
  chord() {
    const t = getAudioCtx().currentTime;
    playOsc('square', 220, 0.1, 0.001, 0.03, t);
    playOsc('sine', 440, 0.08, 0.001, 0.06, t);
    playNoise(0.06, 0.04, t);
  },
  win() {
    const t = getAudioCtx().currentTime;
    const notes = [523, 659, 784, 1047, 1319];
    notes.forEach((freq, i) => {
      playOsc('sine', freq, 0.18, 0.01, 0.18, t + i * 0.13);
      playOsc('triangle', freq * 0.5, 0.08, 0.01, 0.2, t + i * 0.13);
    });
    [1047, 1319, 1568].forEach((freq, i) => {
      playOsc('sine', freq, 0.1, 0.005, 0.12, t + 0.7 + i * 0.1);
    });
  },
  lose() {
    const t = getAudioCtx().currentTime;
    playSweep('sawtooth', 400, 80, 0.3, 0.01, 0.4, t);
    playSweep('square', 300, 60, 0.2, 0.01, 0.4, t + 0.05);
    [0.15, 0.25, 0.35, 0.45].forEach(d => {
      playNoise(0.15, 0.04, t + d);
      playOsc('square', 120, 0.1, 0.001, 0.03, t + d);
    });
  }
};

// ─── Ambient Music ────────────────────────────────────────────────────────────

const MUSIC = (() => {
  let running = false;
  let loopTimer = null;
  let activeNodes = [];
  const masterVol = 0.07;

  // Minor pentatonic scale root shifts each load for variety
  const roots = [61.74, 55.0, 65.41, 73.42, 69.3]; // B1, A1, C2, D2, C#2
  const root = roots[Math.floor(Math.random() * roots.length)];

  function buildReverb(ctx) {
    const rev = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 2.5);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
      }
    }
    rev.buffer = buf;
    return rev;
  }

  function makeMasterChain(ctx) {
    const masterGain = ctx.createGain();
    masterGain.gain.value = masterVol;

    const rev = buildReverb(ctx);
    const revGain = ctx.createGain();
    revGain.gain.value = 0.35;
    const dryGain = ctx.createGain();
    dryGain.gain.value = 0.7;

    masterGain.connect(dryGain);
    dryGain.connect(ctx.destination);
    masterGain.connect(rev);
    rev.connect(revGain);
    revGain.connect(ctx.destination);

    activeNodes.push(masterGain, rev, revGain, dryGain);
    return masterGain;
  }

  function addDrone(dest, ctx, startTime) {
    // Stack of detuned oscillators for a slow atmospheric pad
    const intervals = [1, 1.5, 2, 3, 4, 2 * 1.189]; // root, 5th, octave, etc.
    intervals.forEach((ratio, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();

      osc.type = i % 2 === 0 ? 'sine' : 'triangle';
      osc.frequency.value = root * ratio + i * 0.13; // slight detune per voice

      // Slow tremolo LFO
      lfo.frequency.value = 0.07 + i * 0.03;
      lfoGain.gain.value = 0.015;
      lfo.connect(lfoGain);
      lfoGain.connect(gain.gain);

      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(0.12 / intervals.length, startTime + 3 + i * 0.5);

      osc.connect(gain);
      gain.connect(dest);
      lfo.start(startTime);
      osc.start(startTime);

      activeNodes.push(osc, gain, lfo, lfoGain);
    });
  }

  function addArp(dest, ctx, startTime, progress) {
    // Pentatonic minor notes in high register, shuffled each loop
    const baseNotes = [8, 9.5, 11.35, 13.5, 16, 19, 16, 13.5, 11.35, 9.5];
    const notes = baseNotes.map(r => root * r);

    // Shuffle for variation
    for (let i = notes.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [notes[i], notes[j]] = [notes[j], notes[i]];
    }

    // Step time shrinks as board clears from ~2.1s at 0% down to ~0.45s at 100%
    // progress is 0.0 to 1.0
    const p = Math.max(0, Math.min(1, progress || 0));
    const stepTime = 2.1 - p * 1.65 + Math.random() * 0.15;

    // Note duration also tightens so notes don't bleed into each other at high speed
    const noteDuration = Math.max(0.08, 1.6 - p * 1.2);
    const attackTime = Math.max(0.02, 0.4 - p * 0.3);
    const holdTime = Math.max(0.02, 0.9 - p * 0.7);

    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;

      const st = startTime + i * stepTime;
      gain.gain.setValueAtTime(0, st);
      gain.gain.linearRampToValueAtTime(0.09, st + attackTime);
      gain.gain.setValueAtTime(0.09, st + holdTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, st + noteDuration);

      osc.connect(gain);
      gain.connect(dest);
      osc.start(st);
      osc.stop(st + noteDuration + 0.01);

      activeNodes.push(osc, gain);
    });

    return notes.length * stepTime;
  }

  function addBassPulses(dest, ctx, startTime) {
    // Very low sine pulses — more felt than heard
    const offsets = [0, 4.5, 9.5, 14];
    offsets.forEach(offset => {
      if (Math.random() < 0.75) { // not every pulse fires every loop
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = root * 0.5; // sub octave

        const st = startTime + offset;
        gain.gain.setValueAtTime(0, st);
        gain.gain.linearRampToValueAtTime(0.25, st + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.0001, st + 1.4);

        osc.connect(gain);
        gain.connect(dest);
        osc.start(st);
        osc.stop(st + 1.5);

        activeNodes.push(osc, gain);
      }
    });
  }

  function addGlitches(dest, ctx, startTime, loopDuration) {
    // Sparse random high-freq blips
    const numGlitches = Math.floor(Math.random() * 4) + 1;
    for (let i = 0; i < numGlitches; i++) {
      const offset = Math.random() * loopDuration;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 1400 + Math.random() * 900;

      const st = startTime + offset;
      gain.gain.setValueAtTime(0, st);
      gain.gain.linearRampToValueAtTime(0.018, st + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.06);

      osc.connect(gain);
      gain.connect(dest);
      osc.start(st);
      osc.stop(st + 0.07);

      activeNodes.push(osc, gain);
    }
  }

  function loop() {
    if (!running) return;

    const ctx = getAudioCtx();
    const startTime = ctx.currentTime;
    const dest = makeMasterChain(ctx);

    // Read current board completion to drive arp speed
    const progress = MUSIC.getProgress ? MUSIC.getProgress() : 0;

    addDrone(dest, ctx, startTime);
    addBassPulses(dest, ctx, startTime);
    const arpDuration = addArp(dest, ctx, startTime + 2, progress);
    const loopDuration = Math.max(arpDuration + 2, 20);
    addGlitches(dest, ctx, startTime, loopDuration);

    // Schedule next loop slightly before this one ends to avoid gaps
    loopTimer = setTimeout(loop, (loopDuration - 1.5) * 1000);
  }

  return {
    start() {
      if (running) return;
      running = true;
      loop();
    },
    stop() {
      running = false;
      clearTimeout(loopTimer);
      activeNodes.forEach(n => {
        try { n.stop && n.stop(0); } catch(e) {}
        try { n.disconnect(); } catch(e) {}
      });
      activeNodes = [];
    },
    isRunning() {
      return running;
    },
    // Called each loop to get current board clear percentage (0.0 – 1.0)
    getProgress() {
      return getBoardProgress();
    }
  };
})();

// ─── Game State ───────────────────────────────────────────────────────────────

let rows = 9;
let cols = 9;
let totalMines = 10;
let board = [];
let revealed = [];
let flagged = [];
let gameOver = false;
let firstClick = true;
let timerInterval = null;
let seconds = 0;
let winStreak = 0;
let bestStreak = 0;

// ─── Board Progress ───────────────────────────────────────────────────────────

// Returns 0.0 (nothing revealed) to 1.0 (all safe cells cleared)
function getBoardProgress() {
  if (!board.length) return 0;
  let totalSafe = 0;
  let revealedSafe = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] !== -1) {
        totalSafe++;
        if (revealed[r][c]) revealedSafe++;
      }
    }
  }
  return totalSafe > 0 ? revealedSafe / totalSafe : 0;
}

// ─── Difficulty ───────────────────────────────────────────────────────────────

function setDifficulty(r, c, m, btn) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  rows = r;
  cols = c;
  totalMines = m;
  init();
}

// ─── Init ─────────────────────────────────────────────────────────────────────

function toggleMusic() {
  if (MUSIC.isRunning()) {
    MUSIC.stop();
    document.getElementById('mute-btn').textContent = '♪ OFF';
  } else {
    MUSIC.start();
    document.getElementById('mute-btn').textContent = '♪ MUSIC';
  }
}

function init() {
  const wasPlaying = MUSIC.isRunning();
  MUSIC.stop();
  clearInterval(timerInterval);
  seconds = 0;
  document.getElementById('timer').textContent = '000';
  document.getElementById('mine-count').textContent = totalMines;
  gameOver = false;
  firstClick = true;
  board = Array.from({ length: rows }, () => Array(cols).fill(0));
  revealed = Array.from({ length: rows }, () => Array(cols).fill(false));
  flagged = Array.from({ length: rows }, () => Array(cols).fill(false));
  document.documentElement.style.setProperty('--board-cols', cols);
  renderBoard();
  if (wasPlaying) MUSIC.start();
}

// ─── Mine Placement ───────────────────────────────────────────────────────────

function placeMines(safeRow, safeCol) {
  let placed = 0;
  while (placed < totalMines) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    if (board[r][c] === -1) continue;
    // Keep a safe zone around the first click
    if (Math.abs(r - safeRow) <= 1 && Math.abs(c - safeCol) <= 1) continue;
    board[r][c] = -1;
    placed++;
  }
  // Calculate neighbor counts
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] === -1) continue;
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) {
            count++;
          }
        }
      }
      board[r][c] = count;
    }
  }
}

// ─── Board Rendering ──────────────────────────────────────────────────────────

function renderBoard() {
  const el = document.getElementById('board');
  el.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
  el.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;

      cell.addEventListener('click', onCellClick);
      cell.addEventListener('contextmenu', onCellRightClick);

      // Long press to flag on mobile
      let pressTimer;
      let touchMoved = false;
      cell.addEventListener('touchstart', e => {
        touchMoved = false;
        pressTimer = setTimeout(() => {
          if (!touchMoved) {
            e.preventDefault();
            onCellRightClick({ currentTarget: cell, preventDefault: () => {} });
          }
        }, 450);
      }, { passive: false });
      cell.addEventListener('touchmove', () => {
        touchMoved = true;
        clearTimeout(pressTimer);
      });
      cell.addEventListener('touchend', () => clearTimeout(pressTimer));

      el.appendChild(cell);
    }
  }
}

function getCell(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

// ─── Chord Logic ──────────────────────────────────────────────────────────────

function countFlaggedNeighbors(r, c) {
  let count = 0;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr;
      const nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && flagged[nr][nc]) {
        count++;
      }
    }
  }
  return count;
}

// Returns true if a mine was accidentally hit during chord
function tryChord(r, c) {
  let hitMine = false;
  let mineRow = -1;
  let mineCol = -1;

  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr;
      const nc = c + dc;
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      if (flagged[nr][nc] || revealed[nr][nc]) continue;

      if (board[nr][nc] === -1) {
        hitMine = true;
        mineRow = nr;
        mineCol = nc;
      } else {
        flood(nr, nc);
      }
    }
  }

  if (hitMine) {
    triggerLose(mineRow, mineCol);
    return true;
  }
  return false;
}

// ─── Click Handlers ───────────────────────────────────────────────────────────

function onCellClick(e) {
  if (gameOver) return;
  const r = parseInt(e.currentTarget.dataset.r);
  const c = parseInt(e.currentTarget.dataset.c);

  if (flagged[r][c]) return;

  // Click on an already-revealed number — try chord if flags match
  if (revealed[r][c]) {
    const val = board[r][c];
    if (val > 0 && countFlaggedNeighbors(r, c) === val) {
      SFX.chord();
      if (!tryChord(r, c)) {
        updateDisplay();
        updateChordHighlights();
        checkWin();
      }
    }
    return;
  }

  // First click seeds the mines and starts the clock
  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    startTimer();
    MUSIC.start();
    document.getElementById('mute-btn').textContent = '♪ MUSIC';
  }

  if (board[r][c] === -1) {
    triggerLose(r, c);
    return;
  }

  SFX.click();
  flood(r, c);
  updateDisplay();
  updateChordHighlights();
  checkWin();
}

function onCellRightClick(e) {
  e.preventDefault();
  if (gameOver) return;
  const r = parseInt(e.currentTarget.dataset.r);
  const c = parseInt(e.currentTarget.dataset.c);
  if (revealed[r][c]) return;

  flagged[r][c] = !flagged[r][c];
  flagged[r][c] ? SFX.flag() : SFX.unflag();
  getCell(r, c).className = 'cell' + (flagged[r][c] ? ' flagged' : '');

  const totalFlagged = flagged.flat().filter(Boolean).length;
  document.getElementById('mine-count').textContent = totalMines - totalFlagged;

  updateChordHighlights();
}

// ─── Flood Fill ───────────────────────────────────────────────────────────────

function flood(r, c) {
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  if (revealed[r][c] || flagged[r][c]) return;
  revealed[r][c] = true;
  if (board[r][c] === 0) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr || dc) flood(r + dr, c + dc);
      }
    }
  }
}

// ─── Display Updates ──────────────────────────────────────────────────────────

function updateDisplay() {
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!revealed[r][c]) continue;
      const cell = getCell(r, c);
      const val = board[r][c];
      if (cell.classList.contains('freed')) continue;
      cell.className = 'cell revealed' + (val > 0 ? ' n' + val : '');
      cell.textContent = val > 0 ? val : '';
    }
  }
}

function updateChordHighlights() {
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!revealed[r][c]) continue;
      const val = board[r][c];
      if (val <= 0) continue;
      const cell = getCell(r, c);
      const ready = countFlaggedNeighbors(r, c) === val;
      cell.className = 'cell revealed n' + val + (ready ? ' chord-ready' : '');
    }
  }
}

// ─── Win / Lose ───────────────────────────────────────────────────────────────

function makeMinaImg(src) {
  const img = document.createElement('img');
  img.src = src;
  img.className = 'mina-img';
  return img;
}

function triggerLose(clickRow, clickCol) {
  gameOver = true;
  clearInterval(timerInterval);
  SFX.lose();
  winStreak = 0;
  document.getElementById('streak-value').textContent = winStreak;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] !== -1) continue;
      const cell = getCell(r, c);
      cell.innerHTML = '';
      cell.className = 'cell ' + (r === clickRow && c === clickCol ? 'exploded' : 'mine-revealed');
      cell.appendChild(makeMinaImg(MINA_SAD));
    }
  }

  setTimeout(() => showOverlay(false), 800);
}

function checkWin() {
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!revealed[r][c] && board[r][c] !== -1) return;
    }
  }

  gameOver = true;
  clearInterval(timerInterval);
  SFX.win();
  winStreak++;
  if (winStreak > bestStreak) bestStreak = winStreak;
  document.getElementById('streak-value').textContent = winStreak;
  document.getElementById('best-streak-value').textContent = bestStreak;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] !== -1) continue;
      const cell = getCell(r, c);
      cell.innerHTML = '';
      cell.className = 'cell freed';
      cell.appendChild(makeMinaImg(MINA_HAPPY));
    }
  }

  setTimeout(() => showOverlay(true), 600);
}

// ─── Timer ────────────────────────────────────────────────────────────────────

function startTimer() {
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = String(seconds).padStart(3, '0');
  }, 1000);
}

// ─── Overlay ──────────────────────────────────────────────────────────────────

function showOverlay(win) {
  const box = document.getElementById('overlay-box');
  box.className = 'overlay-box ' + (win ? 'win' : 'lose');
  document.getElementById('overlay-mina').src = win ? MINA_HAPPY : MINA_SAD;
  document.getElementById('overlay-title').textContent = win ? 'LIBERATED' : 'RECAPTURED';
  document.getElementById('overlay-sub').textContent = win
    ? `SCP-7934 freed in ${seconds}s · streak: ${winStreak}`
    : 'The Foundation has recaptured SCP-7934';
  document.getElementById('overlay').classList.add('show');
}

init();

</script>
</body>
