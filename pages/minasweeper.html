<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Thank you @galacticsavage on discord for making this!! -->
<title>MINA.SWEEP — SCP-7934</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg: #050810;
    --panel: #0a0f1e;
    --border: #1a2a4a;
    --accent: #4a9eff;
    --accent2: #8b5cf6;
    --danger: #ff4a6e;
    --cell-bg: #0d1425;
    --cell-revealed: #060c18;
    --cell-hover: #111e35;
    --text: #c0d8ff;
    --dim: #3a5580;
    --glow: 0 0 12px rgba(74, 158, 255, 0.4);
    --glow-danger: 0 0 12px rgba(255, 74, 110, 0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(74,158,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(139,92,246,0.04) 0%, transparent 60%);
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-shadow: var(--glow);
  }

  .logo span { color: var(--accent2); }

  .subtitle {
    font-size: 0.7rem;
    color: var(--dim);
    letter-spacing: 0.25em;
    margin-top: 4px;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }

  .diff-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .diff-btn:hover, .diff-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: var(--glow);
  }

  .hud {
    display: flex;
    gap: 30px;
    margin-bottom: 16px;
    align-items: center;
  }

  .hud-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 8px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 90px;
  }

  .hud-label {
    font-size: 0.6rem;
    color: var(--dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .hud-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
  }

  .hud-value.danger { color: var(--danger); }

  .reset-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 20px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .reset-btn:hover {
    background: rgba(74,158,255,0.1);
    box-shadow: var(--glow);
  }

  .board-wrap {
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 12px;
    box-shadow:
      0 0 40px rgba(74,158,255,0.05),
      inset 0 0 20px rgba(0,0,0,0.5);
    position: relative;
  }

  .board-wrap::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  #board {
    display: grid;
    gap: 2px;
    user-select: none;
  }

  .cell {
    width: 36px;
    height: 36px;
    background: var(--cell-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    transition: background 0.1s, transform 0.05s;
    position: relative;
    overflow: hidden;
  }

  .cell:hover:not(.revealed):not(.exploded) {
    background: var(--cell-hover);
    border-color: var(--accent);
  }

  .cell.revealed {
    background: var(--cell-revealed);
    border-color: #080f1f;
    cursor: default;
  }

  .cell.flagged {
    background: rgba(139,92,246,0.12);
    border-color: var(--accent2);
  }

  .cell.flagged::after {
    content: '⚑';
    color: var(--accent2);
    font-size: 1rem;
    filter: drop-shadow(0 0 4px var(--accent2));
  }

  .cell.mine-revealed {
    background: rgba(255,74,110,0.08);
    border-color: var(--danger);
    animation: pulse-mine 1s ease-in-out infinite;
  }

  .cell.exploded {
    background: rgba(255,74,110,0.25) !important;
    border-color: var(--danger) !important;
    box-shadow: var(--glow-danger);
    animation: none !important;
  }

  @keyframes pulse-mine {
    0%, 100% { background: rgba(255,74,110,0.08); }
    50% { background: rgba(255,74,110,0.15); }
  }

  .cell .mina-img {
    width: 28px;
    height: 28px;
    object-fit: cover;
    border-radius: 50%;
    filter: drop-shadow(0 0 3px rgba(255,74,110,0.7));
    animation: mina-glow 2s ease-in-out infinite;
  }

  @keyframes mina-glow {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(255,74,110,0.7)); }
    50% { filter: drop-shadow(0 0 8px rgba(139,92,246,0.9)); }
  }

  .cell.exploded .mina-img {
    animation: explode-spin 0.3s ease-out forwards;
  }

  @keyframes explode-spin {
    0% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.5) rotate(180deg); }
    100% { transform: scale(1) rotate(360deg); }
  }

  .n1 { color: #4a9eff; }
  .n2 { color: #50fa7b; }
  .n3 { color: #ff6b6b; }
  .n4 { color: #bd93f9; }
  .n5 { color: #ff9800; }
  .n6 { color: #8be9fd; }
  .n7 { color: #ff79c6; }
  .n8 { color: #f8f8f2; }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,8,16,0.85);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    backdrop-filter: blur(4px);
  }

  .overlay.show { display: flex; }

  .overlay-box {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 40px 60px;
    text-align: center;
    box-shadow: 0 0 60px rgba(74,158,255,0.1);
    animation: reveal 0.4s ease;
  }

  @keyframes reveal {
    from { opacity: 0; transform: scale(0.9) translateY(-10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .overlay-box.win .overlay-title { color: var(--accent); text-shadow: var(--glow); }
  .overlay-box.lose .overlay-title { color: var(--danger); text-shadow: var(--glow-danger); }

  .overlay-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .overlay-sub {
    color: var(--dim);
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    margin-bottom: 25px;
  }

  .overlay-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9rem;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 12px 30px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: all 0.2s;
  }

  .overlay-btn:hover { background: rgba(74,158,255,0.1); box-shadow: var(--glow); }

  .scanline {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 200;
  }

  footer {
    margin-top: 16px;
    color: var(--dim);
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    opacity: 0.5;
  }
</style>
</head>
<body>
<div class="scanline"></div>

<header>
  <div class="logo">MINA<span>.</span>SWEEP</div>
  <div class="subtitle">SCP-7934 · INSTANCE DETECTION PROTOCOL</div>
</header>

<div class="controls">
  <button class="diff-btn active" onclick="setDifficulty(9,9,10,this)">EASY</button>
  <button class="diff-btn" onclick="setDifficulty(16,16,40,this)">MEDIUM</button>
  <button class="diff-btn" onclick="setDifficulty(16,30,99,this)">HARD</button>
</div>

<div class="hud">
  <div class="hud-panel">
    <div class="hud-label">INSTANCES</div>
    <div class="hud-value danger" id="mine-count">10</div>
  </div>
  <button class="reset-btn" onclick="init()">[ REINIT ]</button>
  <div class="hud-panel">
    <div class="hud-label">ELAPSED</div>
    <div class="hud-value" id="timer">000</div>
  </div>
</div>

<div class="board-wrap">
  <div id="board"></div>
</div>

<footer>RIGHT CLICK / LONG PRESS TO FLAG · LEFT CLICK TO REVEAL</footer>

<div class="overlay" id="overlay">
  <div class="overlay-box" id="overlay-box">
    <div class="overlay-title" id="overlay-title"></div>
    <div class="overlay-sub" id="overlay-sub"></div>
    <button class="overlay-btn" onclick="init(); document.getElementById('overlay').classList.remove('show')">[ REINITIALIZE ]</button>
  </div>
</div>

let rows = 9, cols = 9, totalMines = 10;
let board = [], revealed = [], flagged = [], gameOver = false, firstClick = true;
let timerInterval = null, seconds = 0;

function setDifficulty(r, c, m, btn) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  rows = r; cols = c; totalMines = m;
  init();
}

function init() {
  clearInterval(timerInterval);
  seconds = 0;
  document.getElementById('timer').textContent = '000';
  document.getElementById('mine-count').textContent = totalMines;
  gameOver = false;
  firstClick = true;

  board = Array.from({length: rows}, () => Array(cols).fill(0));
  revealed = Array.from({length: rows}, () => Array(cols).fill(false));
  flagged = Array.from({length: rows}, () => Array(cols).fill(false));

  renderBoard();
}

function placeMines(safeR, safeC) {
  let placed = 0;
  while (placed < totalMines) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    if (board[r][c] === -1) continue;
    if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
    board[r][c] = -1;
    placed++;
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] === -1) continue;
      let count = 0;
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) count++;
        }
      board[r][c] = count;
    }
  }
}

function renderBoard() {
  const el = document.getElementById('board');
  el.style.gridTemplateColumns = `repeat(${cols}, 36px)`;
  el.innerHTML = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('click', onLeftClick);
      cell.addEventListener('contextmenu', onRightClick);

      // Long press for mobile
      let pressTimer;
      cell.addEventListener('touchstart', e => {
        pressTimer = setTimeout(() => { e.preventDefault(); onRightClick({currentTarget: cell, preventDefault: ()=>{}}); }, 500);
      }, {passive: false});
      cell.addEventListener('touchend', () => clearTimeout(pressTimer));
      cell.addEventListener('touchmove', () => clearTimeout(pressTimer));

      el.appendChild(cell);
    }
  }
}

function getCell(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

function onLeftClick(e) {
  if (gameOver) return;
  const r = +e.currentTarget.dataset.r;
  const c = +e.currentTarget.dataset.c;
  if (flagged[r][c] || revealed[r][c]) return;

  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    startTimer();
  }

  if (board[r][c] === -1) {
    revealMine(r, c, true);
    return;
  }

  flood(r, c);
  updateDisplay();
  checkWin();
}

function onRightClick(e) {
  e.preventDefault();
  if (gameOver) return;
  const r = +e.currentTarget.dataset.r;
  const c = +e.currentTarget.dataset.c;
  if (revealed[r][c]) return;

  flagged[r][c] = !flagged[r][c];
  const cell = getCell(r, c);
  cell.className = 'cell' + (flagged[r][c] ? ' flagged' : '');

  const flagCount = flagged.flat().filter(Boolean).length;
  document.getElementById('mine-count').textContent = totalMines - flagCount;
}

function flood(r, c) {
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  if (revealed[r][c] || flagged[r][c]) return;
  revealed[r][c] = true;
  if (board[r][c] === 0) {
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++)
        if (dr !== 0 || dc !== 0) flood(r + dr, c + dc);
  }
}

function updateDisplay() {
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (revealed[r][c]) {
        const cell = getCell(r, c);
        cell.className = 'cell revealed';
        const v = board[r][c];
        if (v > 0) {
          cell.textContent = v;
          cell.classList.add('n' + v);
        }
      }
    }
  }
}

function revealMine(clickR, clickC, exploded) {
  gameOver = true;
  clearInterval(timerInterval);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] === -1) {
        const cell = getCell(r, c);
        const img = document.createElement('img');
        img.src = MINA_B64;
        img.className = 'mina-img';
        if (r === clickR && c === clickC) {
          cell.className = 'cell exploded';
          setTimeout(() => { cell.innerHTML = ''; cell.appendChild(img); }, 0);
        } else {
          cell.className = 'cell mine-revealed';
          cell.innerHTML = '';
          cell.appendChild(img);
        }
      }
    }
  }
  setTimeout(() => showOverlay(false), 800);
}

function checkWin() {
  let unrevealedSafe = 0;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (!revealed[r][c] && board[r][c] !== -1) unrevealedSafe++;
  if (unrevealedSafe === 0) {
    gameOver = true;
    clearInterval(timerInterval);
    setTimeout(() => showOverlay(true), 300);
  }
}

function startTimer() {
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = String(seconds).padStart(3, '0');
  }, 1000);
}

function showOverlay(win) {
  const box = document.getElementById('overlay-box');
  box.className = 'overlay-box ' + (win ? 'win' : 'lose');
  document.getElementById('overlay-title').textContent = win ? 'CONTAINED' : 'PROPAGATED';
  document.getElementById('overlay-sub').textContent = win
    ? `SCP-7934 instances neutralized in ${seconds}s`
    : 'SCP-7934 has breached containment';
  document.getElementById('overlay').classList.add('show');
}

init();
</script>
</body>
</html>
